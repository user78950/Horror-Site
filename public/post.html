<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>괴담 · 무서운 게 딱좋아!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 30 30" fill="none" stroke="#ff2a4b" stroke-width="1.6" aria-hidden="true"><circle cx="15" cy="15" r="13"/><path d="M15 3 L22 25 L4 11 H26 L8 25 Z"/><circle cx="15" cy="15" r="2.4" fill="#ff2a4b"/></svg>
      무서운 게 딱좋아!
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="index.html">실시간 괴담</a>
      <a href="index.html?tab=hof">명예의 전당</a>
      <a href="index.html?tab=intl">해외 번역 썰</a>
      <a href="index.html?tab=real">창작/실화 괴담</a>
      <a href="movies.html">공포영화 랭킹</a>
    </nav>
    <div class="header-actions">
      <div class="user" data-auth-slot></div>
      <a href="write.html" class="btn btn--primary">괴담 작성</a>
    </div>
  </div>
</header>

<main class="container page" style="max-width: 900px">

  <p class="post-state" id="post-state" aria-live="polite">불러오는 중…</p>

  <div class="post-view" id="post-view" hidden>

    <section class="fx-gate" id="fx-gate" aria-label="소리 설정" hidden>
      <div class="fx-gate__text">
        <p class="fx-gate__title">이 글에는 소리와 화면 연출이 있어요</p>
        <p class="fx-gate__desc">이어폰을 끼고 소리를 켠 채 읽는 걸 추천해요. 화면이 잠깐 꺼지거나 깜빡이는 장면이 있을 수 있습니다.</p>
      </div>
      <button type="button" class="btn btn--primary btn--lg" id="fx-sound-on">소리 켜고 읽기</button>
      <button type="button" class="btn btn--ghost btn--lg" id="fx-sound-off">소리 없이 읽기</button>
      <button type="button" class="btn btn--text" id="fx-off">연출 없이 읽기</button>
    </section>

    <article class="article">
      <header class="article__head">
        <div class="article__tags" id="post-chips"></div>
        <h1 class="article__title" id="post-title"></h1>
        <p class="article__meta" id="post-meta"></p>
        <p class="post-source" id="post-source" hidden></p>
        <div class="reader-toolbar" role="toolbar" aria-label="독서 설정">
          <button type="button" class="toggle" id="fx-toggle" aria-pressed="true" style="min-height: 40px">연출 켜짐</button>
          <div class="size-control">
            <button type="button" id="size-down" aria-label="글자 작게">A−</button>
            <output id="size-value" aria-live="polite">17px</output>
            <button type="button" id="size-up" aria-label="글자 크게" style="font-size: 17px">A+</button>
          </div>
          <div class="post-actions">
            <a href="write.html" class="btn btn--ghost btn--sm" id="post-edit">수정</a>
            <button type="button" class="btn btn--ghost btn--sm" id="post-delete">삭제</button>
            <a href="guidelines.html#report" class="btn btn--text btn--sm">신고</a>
          </div>
        </div>
      </header>

      <!-- 본문: posts.js 가 서버에서 받아 채움 -->
      <div class="article__body" id="article"></div>
    </article>

    <section class="panel panel--lg reaction" id="reaction" aria-label="반응">
      <div>
        <h2 class="panel__title" style="font-size: 20px">이 괴담에 대한 당신의 반응</h2>
        <p class="mono muted" style="font-size: 12px; margin-top: 4px" id="reaction-sub"></p>
      </div>
      <div class="reaction__buttons">
        <button type="button" class="shudder-big" id="react-like" aria-pressed="false">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12 H7 L9 7 L12 17 L14 10 L15 12 H21"/></svg>
          <span class="shudder-big__label">소름 돋아요!</span>
          <span class="shudder-big__count" id="like-count">0</span>
        </button>
        <button type="button" class="meh-btn" id="react-dislike" aria-pressed="false">덤덤해요 <span class="mono" id="dislike-count">0</span></button>
      </div>
      <p class="reaction__note" id="reaction-note" role="status"></p>
    </section>

    <section class="panel panel--lg" id="cm" aria-label="댓글">
      <div class="panel__head">
        <h2 class="panel__title" style="font-size: 19px">댓글 <span class="mono blood" id="cm-total">0</span></h2>
        <div class="filter-bar__group" data-toggle-group="pressed">
          <button type="button" class="toggle toggle--flat toggle--quiet" aria-pressed="true" data-cm-order="new">최신순</button>
          <button type="button" class="toggle toggle--flat toggle--quiet" aria-pressed="false" data-cm-order="old">오래된순</button>
        </div>
      </div>

      <form class="comment-form" id="cm-form" hidden novalidate>
        <label for="cm-input" class="sr-only">댓글 입력</label>
        <textarea id="cm-input" rows="3" maxlength="1000" placeholder="새벽에 홀로 겪은 비슷한 일이나 추리 가설을 남겨 보세요. (비방·도배 금지)"></textarea>
        <div class="comment-form__row">
          <label><input type="checkbox" id="cm-anon"> 익명으로 쓰기</label>
          <label><input type="checkbox" id="cm-spoiler"> 스포일러로 가리기</label>
          <span class="mono muted" style="font-size: 12px" id="cm-chars">0 / 1000</span>
          <button type="submit" class="btn btn--primary btn--sm" id="cm-submit">흔적 남기기</button>
        </div>
      </form>
      <p class="comment-gate" id="cm-gate" hidden></p>
      <p class="reaction__note" id="cm-note" role="status"></p>
      <div id="cm-list" aria-live="polite"></div>
    </section>

    <div class="fx-again" id="fx-again" hidden>
      <p class="muted" style="font-size: 14px">놓친 연출은 문단 옆 ↻ 버튼으로 다시 볼 수 있어요.</p>
      <button type="button" class="btn btn--ghost" id="fx-restart">처음부터 다시 읽기</button>
    </div>

    <a href="index.html" class="muted" style="font-size: 14px">← 목록으로</a>
  </div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__row">
      <p class="site-footer__brand">무서운 게 딱좋아! <span class="chip chip--amber">심야 모드</span></p>
      <span class="mono" style="font-size: 12px">Do not look behind you.</span>
    </div>
  </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
<script src="js/posts.js"></script>
<script src="js/comments.js"></script>
</body>
</html>
