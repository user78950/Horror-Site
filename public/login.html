<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 심야 Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 30 30" fill="none" stroke="#ff2a4b" stroke-width="1.6" aria-hidden="true"><circle cx="15" cy="15" r="13"/><path d="M15 3 L22 25 L4 11 H26 L8 25 Z"/><circle cx="15" cy="15" r="2.4" fill="#ff2a4b"/></svg>
      심야 Archive
    </a>
  </div>
</header>

<main class="container auth-page">
  <section class="auth-card" aria-labelledby="auth-title">
    <div data-auth-main>
      <p class="editor-bar__kicker">WELCOME BACK</p>
      <h1 class="auth-card__title" id="auth-title">다시 오셨군요</h1>
      <p class="auth-card__lead">로그인하면 괴담을 쓰고, 내 글을 고치거나 지울 수 있어요.</p>
    </div>

    <div class="auth-form" data-auth-main>
      <button type="button" class="btn btn--google btn--lg btn--block" data-google data-auth-action disabled>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        구글로 계속하기
      </button>
      <p class="auth-divider"><span>또는 이메일로</span></p>
      <form id="login-form" class="auth-form" novalidate>
        <div class="field-group">
          <label for="login-email" class="field-label">이메일</label>
          <input id="login-email" type="email" class="text-input" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="login-password" class="field-label">비밀번호</label>
          <input id="login-password" type="password" class="text-input" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--lg btn--block" data-auth-action disabled>로그인</button>
      </form>
      <button type="button" class="btn btn--text btn--sm" id="forgot-btn" data-auth-action disabled style="align-self: flex-start">비밀번호를 잊으셨나요?</button>
      <p class="auth-card__foot">처음이신가요? <a href="signup.html" id="to-signup">회원가입</a></p>
    </div>

    <div id="nickname-step" hidden>
      <h2 class="auth-card__title" style="font-size: 24px">처음 오셨네요</h2>
      <p class="auth-card__lead">이 사이트에서 쓸 닉네임을 정해 주세요. 글과 댓글에 이 이름이 보여요.</p>
      <form id="nickname-form" class="auth-form" novalidate>
        <div class="field-group">
          <label for="first-nickname" class="field-label">닉네임 (2~12자, 한글·영문·숫자·밑줄)</label>
          <input id="first-nickname" type="text" class="text-input" maxlength="12" autocomplete="nickname" required>
        </div>
        <p class="auth-hint">시작하면 <a href="guidelines.html" target="_blank" rel="noopener">커뮤니티 가이드라인</a>에 동의하는 것으로 봐요.</p>
        <button type="submit" class="btn btn--primary btn--lg btn--block" data-auth-action>시작하기</button>
      </form>
    </div>
    <p class="auth-msg" id="auth-msg" role="alert"></p>
  </section>
</main>

<script src="js/auth.js"></script>
<script type="module" src="js/firebase-auth.js"></script>
</body>
</html>
