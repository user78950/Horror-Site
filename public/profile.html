<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로필 · 심야 archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 30 30" fill="none" stroke="#ff2a4b" stroke-width="1.6" aria-hidden="true"><circle cx="15" cy="15" r="13"/><path d="M15 3 L22 25 L4 11 H26 L8 25 Z"/><circle cx="15" cy="15" r="2.4" fill="#ff2a4b"/></svg>
      <span class="logo__name">심야 <span class="logo__en">archive</span></span>
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="index.html">실시간 괴담</a>
      <a href="index.html?tab=hof">명예의 전당</a>
      <a href="index.html?tab=intl">해외 번역 썰</a>
      <a href="index.html?tab=real">창작/실화 괴담</a>
      <a href="movies.html">공포영화 랭킹</a>
    </nav>
    <div class="header-actions">
      <div class="user" data-auth-slot></div>
      <a href="write.html" class="btn btn--primary">괴담 작성</a>
    </div>
  </div>
</header>

<main class="container page" style="max-width: 960px">
  <p class="post-state" id="profile-state" aria-live="polite">불러오는 중…</p>

  <div id="profile-view" hidden style="display: flex; flex-direction: column; gap: 22px">
    <section class="panel panel--lg profile-head">
      <span class="profile-avatar" id="profile-avatar" aria-hidden="true"></span>
      <div class="profile-info">
        <h1 class="profile-name" id="profile-name"></h1>
        <p class="muted" id="profile-joined"></p>
        <p class="profile-stats" id="profile-stats"></p>
      </div>
      <div class="profile-actions" id="profile-actions" hidden>
        <a href="write.html" class="btn btn--primary btn--sm">새 괴담 쓰기</a>
        <a href="account.html" class="btn btn--ghost btn--sm">계정 설정</a>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px" aria-labelledby="profile-posts-title">
      <div class="panel__head">
        <h2 class="panel__title" id="profile-posts-title">쓴 괴담</h2>
        <div class="filter-bar__group" data-toggle-group="pressed">
          <button type="button" class="toggle toggle--flat toggle--quiet mono" aria-pressed="true" data-psort="new">최신순</button>
          <button type="button" class="toggle toggle--flat toggle--quiet mono" aria-pressed="false" data-psort="hot">소름 많은순</button>
        </div>
      </div>
      <div id="profile-posts" style="display: flex; flex-direction: column; gap: 14px" aria-live="polite"></div>
      <button type="button" class="btn btn--ghost" id="profile-more" hidden>더 보기</button>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__row">
      <p class="site-footer__brand"><span class="logo__name">심야 <span class="logo__en">archive</span></span> <span class="chip chip--amber">공포 이야기 아카이브</span></p>
      <span class="site-footer__links"><a href="guidelines.html">커뮤니티 가이드라인</a><a href="privacy.html">개인정보 처리방침</a></span>
      <span class="mono" style="font-size: 12px">Do not look behind you.</span>
    </div>
  </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
