<main class="container page" style="max-width: 960px">
  <div class="guide__head">
    <h1 class="guide__title">신고 관리</h1>
    <p class="guide__lead">신고된 글과 댓글을 확인하고 처리해요. 같은 글·댓글에 온 신고는 하나로 묶여 보여요.</p>
    <p style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><a class="btn btn--ghost btn--sm" href="/api/admin/backup" download>DB 백업 내려받기</a><span class="muted" style="font-size: 12px">회원 이메일과 글이 들어 있으니 안전한 곳에만 보관하세요.</span></p>
  </div>

  <p class="post-state" id="admin-state" aria-live="polite">불러오는 중…</p>

  <div id="admin-view" hidden style="display: flex; flex-direction: column; gap: 16px">
    <div class="filter-bar__group" role="tablist" aria-label="처리 상태" data-toggle-group="selected">
      <button type="button" class="toggle toggle--solid" role="tab" aria-selected="true" data-status="open">대기 중 <span class="mono" id="admin-open-count"></span></button>
      <button type="button" class="toggle toggle--solid" role="tab" aria-selected="false" data-status="resolved">처리함</button>
      <button type="button" class="toggle toggle--solid" role="tab" aria-selected="false" data-status="dismissed">문제 없음</button>
    </div>
    <p class="reaction__note" id="admin-note" role="status"></p>
    <div id="admin-list" style="display: flex; flex-direction: column; gap: 14px"></div>
  </div>
</main>
